<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- headタグの中にはメタデータ等を記載する -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しりとりゲーム</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- bodyタグの中には実際に表示するものなどを書く -->
  <div class="container">
    <h1>しりとりゲーム</h1>
    
    <!-- ゲーム設定エリア -->
    <div id="gameSettings" class="settings">
      <h3>ゲーム設定</h3>
      <div class="mode-selection">
        <label>
          <input type="radio" name="gameMode" value="normal" checked> ノーマルモード
        </label>
        <label>
          <input type="radio" name="gameMode" value="no-duplicate"> 重複禁止モード
        </label>
        <label>
          <input type="radio" name="gameMode" value="time-limit"> 制限時間モード
        </label>
        <label>
          <input type="radio" name="gameMode" value="both"> 縛りプレイ（重複禁止＋制限時間）
        </label>
      </div>
      <div class="time-setting">
        <label for="timeLimit">制限時間（秒）:</label>
        <input type="number" id="timeLimit" value="60" min="10" max="300">
      </div>
      <button id="startGameButton">ゲーム開始</button>
    </div>

    <!-- ゲーム情報表示エリア -->
    <div id="gameInfo" class="game-info">
      <div class="info-row">
        <span id="score">スコア: 0</span>
        <span id="usedWordsCount">使用単語数: 1</span>
        <span id="timer"></span>
      </div>
      <div id="currentMode">モード: ノーマル</div>
    </div>

    <!-- ゲームプレイエリア -->
    <div id="gameArea" class="game-area">
      <!-- 現在の単語を表示する場所 -->
      <p id="previousWord">前の単語: しりとり</p>
      <!-- 次の文字を入力するフォーム -->
      <div class="input-area">
        <input id="nextWordInput" type="text" placeholder="次の単語を入力してください" />
        <button id="nextWordSendButton">送信</button>
      </div>
      <button id="resetButton">リセット</button>
    </div>

    <!-- ランキング表示エリア -->
    <div id="rankingArea" class="ranking">
      <h3>ランキング</h3>
      <button id="showRankingButton">ランキングを表示</button>
      <div id="rankingList"></div>
    </div>

    <!-- ゲーム終了ダイアログ -->
    <div id="gameOverDialog" class="dialog" style="display: none;">
      <div class="dialog-content">
        <h3>ゲーム終了</h3>
        <p id="gameOverMessage"></p>
        <p id="finalScoreDisplay"></p>
        <input type="text" id="playerNameInput" placeholder="お名前を入力してください" maxlength="20">
        <div class="dialog-buttons">
          <button id="saveScoreButton">スコアを保存</button>
          <button id="newGameButton">新しいゲーム</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScriptを実行 -->
  <script type="module" src="main.js"></script>
</body>

</html>
